# Closed-loop (SimplerEnv) conversion variants for the frozen policy. See tools/sim_policy.py for each knob.
# Goal-image conditioning is not available closed-loop (the goal frame is unknown), so tasks are "lang" or "none".
#
#   task          lang | none
#   window        observation history (trained with 5)
#   ensemble      average the overlapping 4-step chunks (SimplerEnv Octo default) or execute chunk[0] only
#   action_scale  multiplies translation and rotation (1.0 = official)
#   rotation      euler_to_axangle (official) | raw (euler deltas sent as axis-angle)
#   stats         self (own dataset statistics) | <dataset name> (another robot's statistics)
#   sticky_repeat Google Robot gripper hold length (official 15); WidowX uses 1

sim_baseline:      {task: lang, window: 5, ensemble: true, action_scale: 1.0, rotation: euler_to_axangle, stats: self}
sim_notask:        {task: none, window: 5, ensemble: true, action_scale: 1.0, rotation: euler_to_axangle, stats: self}
sim_no_ensemble:   {task: lang, window: 5, ensemble: false, action_scale: 1.0, rotation: euler_to_axangle, stats: self}
