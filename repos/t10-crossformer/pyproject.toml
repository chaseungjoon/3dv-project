[project]
name = "crossformer-env"
version = "0.1.0"
description = "uv env for CrossFormer (T10) inference on RTX 5070 (sm_120): jax 0.6 cuda12 + TF 2.19 (CPU, data/text only)"
requires-python = "==3.10.*"
dependencies = [
    # jax 0.4.20 (upstream pin) has no sm_120 kernels; 0.6.2 is the newest line flax 0.10.x supports
    "jax[cuda12]==0.6.2",
    "flax==0.10.7",
    "orbax-checkpoint==0.11.16",
    "optax==0.2.5",
    "chex==0.1.89",
    "numpy==1.26.4",
    # TF is only used on CPU: RLDS loading, image resize, Universal Sentence Encoder
    "tensorflow==2.19.0",
    "tensorflow-text==2.19.0",
    "tensorflow-hub==0.16.1",
    "tensorflow-datasets==4.9.9",
    "tensorflow-metadata==1.16.1",  # 1.17+ is generated with protobuf 6; TF 2.19 needs protobuf 5
    "tf-keras==2.19.0",
    "setuptools<80",  # tensorflow_hub imports pkg_resources
    "dlimp",
    "ml-collections>=0.1.1",
    "einops>=0.6.1",
    "huggingface-hub>=0.24",
    "scipy",
    "tqdm",
    "absl-py",
    "pyyaml",
    "pandas",
    "matplotlib",
    "opencv-python",  # not -headless: mani_skill2_real2sim depends on opencv-python
    "mediapy",
    "imageio",
    "requests",
    # closed-loop real-to-sim evaluation (SimplerEnv: WidowX/Bridge and Google Robot scenes, SAPIEN 2.2.2)
    "simpler-env",
    "mani-skill2-real2sim",
    "transforms3d",
]

[dependency-groups]
dev = ["ipykernel"]

[tool.uv]
package = false
# dlimp pins tensorflow==2.15.0; TF 2.15 cannot coexist with jax 0.6 (ml_dtypes)
override-dependencies = ["tensorflow==2.19.0"]

[tool.uv.sources]
dlimp = { git = "https://github.com/kvablack/dlimp", rev = "5edaa4691567873d495633f2708982b42edf1972" }
simpler-env = { git = "https://github.com/simpler-env/SimplerEnv", rev = "eddb5690749a1e34267807c0f7b5eede323918d7" }
mani-skill2-real2sim = { git = "https://github.com/simpler-env/ManiSkill2_real2sim", rev = "ef7a4d4fdf4b69f2c2154db5b15b9ac8dfe10682" }

[tool.black]
# https://github.com/psf/black
line-length = 88
target-version = ["py310"]
exclude = "(.eggs|.git|.hg|.mypy_cache|.nox|.tox|.venv|.svn|_build|buck-out|build|dist)"

[tool.isort]
profile = "black"
line_length = 88
force_sort_within_sections = "True"
order_by_type = "False"
