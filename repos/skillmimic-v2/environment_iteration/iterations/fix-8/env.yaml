# if given, will override the device setting in gym. 
env: 
  numEnvs: 2048
  envSpacing: 2 #0
  episodeLength: 0
  isFlagrun: False
  enableDebugVis: False
  playdataset: False
  projtype: "None"
  saveImages: "" #False
  initVel: False
  
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 1 # 30 fps
  stateInit: "Random" # 2 # 
  hybridInitProb: 0.5
  dataFPS: 30 # 30 fps
  dataFramesScale: 1. # 30 fps
  ballSize: 1.
  ballRestitution: 0. # 0.81
  ballDensity: 456. # [3dv] 1.0 kg book (upstream 2500 -> 7.1 kg in the sim), see the fix block below
  
  localRootObs: False
  keyBodies: ["jC1Head", "jLeftKnee", "jRightKnee", "jLeftElbow", "jRightElbow", "jLeftAnkle", "jRightAnkle", "jLeftIP", "jLeftSecondDIP", "jLeftThirdDIP", "jLeftFourthDIP","jLeftFifthDIP","jRightIP", "jRightSecondDIP", "jRightThirdDIP", "jRightFourthDIP","jRightFifthDIP"]
  contactBodies: ["jLeftIP", "jLeftSecondDIP", "jLeftThirdDIP", "jLeftFourthDIP","jLeftFifthDIP","jRightIP", "jRightSecondDIP", "jRightThirdDIP", "jRightFourthDIP","jRightFifthDIP"]
  terminationHeight: 0.25
  enableEarlyTermination: True #False #True

  asset:
    assetRoot: "skillmimic/data/assets" #projectname
    assetFileName: "mjcf/mocap_parahome_boxhand_refobj.xml" #"mjcf/mocap_humanoid_boxhand.xml"

  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.8 #1.6 #0.99 #0. #1.6
  
  rewardWeights:
    p: 20.
    r: 20.
    pv: 0.
    rv: 0.

    # fix-6: sharpen the book-position term around the 0.10 m tracking tolerance.
    op: 30.
    or: 0.
    opv: 0.
    orv: 0.

    ig: 20.

    cg1: 5.
    cg2: 5.

  enableTaskObs: False #ZC0
  state_init_random_prob: 0.1
  in_scene_obj_static: ['desk']
  in_scene_obj_dynamic: ['book']

  # ---- [3dv] book fix (project root SKILLMIMIC_NOTES.md 4). Everything else is upstream place_book.yaml, except
  # ballDensity above. Same fixes as drink_cup_fix.yaml; numbers from experiments/tools/make_book_collision.py. ----
  # desk: the upstream 10k-voxel hull puts the book ~3.8 cm above its reference. One box fitted to the desk top of
  # the mesh in the scene pose, top at the book's reference bottom.
  staticBoxes: {desk: {size: [1.214, 0.723, 0.05], center: [1.647, 0.409], top: 0.716, yawDeg: 74.77}}
  # book: its oriented bounding box (26.9 x 17.5 x 4.7 cm) as one convex mesh instead of a coarse decomposition
  dynamicUrdf: book_fix.urdf
  dynamicVhacd: {enabled: False}
  # history-encoder input in the layout the encoder was trained on (SKILLMIMIC_NOTES.md 4)
  histLayoutFix: True
  # training only: end the episode when the book is > 0.25 m from its reference (task SkillMimicParahomeLocalHistRISBuffernodePhase)
  objTerminationDist: 0.25
  # [3dv] fix-4: hand run.py --reweight to the start-frame sampler (task SkillMimicParahomeIterATS,
  # environment_iteration/src/tasks/ats.py). Upstream computes the ATS rates but never enables them in the sampler.
  atsSampler: True
  # [3dv] fix-5: "connection" starts (task SkillMimicParahomeIterOwnStart, environment_iteration/src/tasks/own_start.py).
  # 20% of training resets start from a buffered state of the policy itself, captured at reference frames 75-95 in
  # episodes that started at reference frame <= 60 (the policy did the pickup itself) while the book was within
  # 0.20 m of its reference. History, phase and reference are those of the captured frame. Evaluation unchanged.
  ownStartProb: 0.2
  ownStartFrames: [75, 95]
  ownStartMaxStart: 60
  ownStartObjDist: 0.20
  ownStartBuffer: 1024
  ownStartPerStep: 8
  ownStartMinFill: 64
  # [3dv] fix-8: state sync (task SkillMimicParahomeIterStateSync, environment_iteration/src/tasks/state_sync.py).
  # Reward, book termination and own-start capture use the refreshed post-step state s_{k+1} and its reference
  # frame (sframe+k+1) instead of the pre-refresh state s_k. Observation, episode, ATS, own-start settings, reward
  # weights, physics and evaluation unchanged. Note: terminationHeight above is not read upstream (effective 0.30 m,
  # HumanoidWholeBody._build_termination_heights); fix-8 keeps the effective 0.30 m.
  stateSync: True

sim:
  substeps: 2 #ZC
  physx:
    num_threads: 4
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 10
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0
  
  flex:
    num_inner_iterations: 10
    warm_start: 0.25
